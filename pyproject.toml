[project]
name = "pythonz"
dynamic = ["version"]
description = "Source code for pythonz.net"
authors = [
    { name = "Igor Starikov", email = "idlesign@yandex.ru" }
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "awesome-slugify~=1.6.5",
    "beautifulsoup4~=4.15.0",
    "bleach~=6.4.0",
    "django~=6.1.3",
    "django-admirarchy~=1.2.3",
    "django-etc~=1.6.0",
    "django-robots~=7.0",
    "django-siteajax~=1.0.0",
    "django-siteblocks~=1.2.2",
    "django-sitecats~=1.3.0",
    "django-siteflags~=1.3.1",
    "django-siteforms~=1.4.0",
    "django-sitegate~=1.5.0",
    "django-sitemessage~=1.4.1",
    "django-sitemetrics~=1.3.0",
    "django-siteprefs~=1.3.0",
    "django-sitetree~=1.20.0",
    "django-yaturbo~=1.0.1",
    "envbox~=2.1.0",
    "feedparser~=6.0.14",
    "icalendar-light~=1.1.0",
    "linkify-it-py>=2.2.0",
    "lxml~=6.1.0",
    "markdown-it-py~=4.3.0",
    "mdit-py-plugins>=0.7.0",
    "pillow~=13.0.0",
    "psycopg[binary]~=3.3.9",
    "pytelegrambotapi~=4.37.1",
    "pytz~=2026.6",
    "regex~=2026.11.19",
    "requests[socks]~=2.34.2",
    "sentry-sdk~=2.75.0",
    "uwsgi~=2.0.31",
    "uwsgiconf[cli]~=2.4.1",
]

[project.urls]
Homepage = "https://github.com/idlesign/pythonz"

[project.scripts]
pythonz = "pythonz.manage:main"

[dependency-groups]
dev = [
    {include-group = "linters"},
    {include-group = "tests"},
    {include-group = "runtime"},
]
linters = [
]
tests = [
    "pytest~=9.2.0",
    "pytest-djangoapp~=1.9.0",
    "pytest-responsemock~=2.0.0",
    "freezegun~=1.5.5",
]
runtime = [
    "django-debug-toolbar~=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pythonz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pythonz/"]

[tool.hatch.build.targets.sdist]
packages = ["pythonz/"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "slow: long running tests",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = [
    "pythonz/",
]
omit = [
    "pythonz/apps/migrations/*",
]

[tool.coverage.report]
fail_under = 90.00
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.tox]
skip_missing_interpreters = true
env_list = [
  "py310",
  "py311",
  "py312",
  "py313",
]

[tool.tox.env_run_base]
dependency_groups = ["tests"]
commands = [
  ["pytest", { replace = "posargs", default = ["tests"], extend = true }],
]
